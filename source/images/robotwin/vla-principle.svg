<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc">
  <title id="title">VLA 从视觉与语言到机器人动作的概念流程</title>
  <desc id="desc">图像、指令与可选的机器人状态经过编码与特征交互，动作输出部分以自回归 token 预测或流匹配等方式生成动作。具体结构依模型而异。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#468c75"/></marker></defs>
  <rect width="640" height="860" rx="24" fill="#f5f9f6"/>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="36" y="57" font-size="29" font-weight="700" fill="#224c3e">VLA：观察、理解、生成动作</text>
    <text x="36" y="94" font-size="21" fill="#6c7c73">以两类模型为例，帮助理解输入与输出</text>
    <g fill="#fff" stroke="#cedfd5" stroke-width="2">
      <rect x="36" y="132" width="176" height="142" rx="16"/>
      <rect x="232" y="132" width="176" height="142" rx="16"/>
      <rect x="428" y="132" width="176" height="142" rx="16"/>
    </g>
    <g text-anchor="middle" font-size="26" font-weight="600" fill="#2f4f3e"><text x="124" y="175">相机图像</text><text x="320" y="175">语言指令</text><text x="516" y="175">机器人状态</text></g>
    <g text-anchor="middle" font-size="22" fill="#61756a"><text x="124" y="216">画面特征</text><text x="124" y="246">图像编码</text><text x="320" y="216">操作目标</text><text x="320" y="246">文本 token</text><text x="516" y="216">关节、夹爪等</text><text x="516" y="246">依模型选用</text></g>
    <g fill="none" stroke="#468c75" stroke-width="3" marker-end="url(#arrow)"><path d="M124 274V311H320V341"/><path d="M320 274V341"/><path d="M516 274V311H320V341"/></g>
    <rect x="56" y="351" width="528" height="116" rx="18" fill="#e2efe7" stroke="#c5dccd" stroke-width="2"/>
    <text x="320" y="398" text-anchor="middle" font-size="28" font-weight="600" fill="#326b54">Transformer 中的特征交互</text>
    <text x="320" y="438" text-anchor="middle" font-size="23" fill="#4c6256">结合任务目标、画面与当前状态</text>
    <g fill="none" stroke="#468c75" stroke-width="3" marker-end="url(#arrow)"><path d="M320 467V494H172V524"/><path d="M320 494H468V524"/></g>
    <rect x="36" y="534" width="272" height="158" rx="18" fill="#fff" stroke="#cedfd5" stroke-width="2"/>
    <rect x="332" y="534" width="272" height="158" rx="18" fill="#f8ecdc" stroke="#ead5b7" stroke-width="2"/>
    <g text-anchor="middle"><text x="172" y="575" font-size="26" font-weight="600" fill="#326b54">自回归动作 token</text><text x="172" y="613" font-size="22" fill="#4c6256">逐个预测 → 还原数值</text><text x="172" y="657" font-size="22" fill="#6c7c73">例：原始 OpenVLA</text><text x="468" y="575" font-size="26" font-weight="600" fill="#8b6030">连续动作流匹配</text><text x="468" y="613" font-size="22" fill="#806647">噪声 → 多次更新 → 动作</text><text x="468" y="657" font-size="22" fill="#8b765b">例：π₀ 的动作块</text></g>
    <g fill="none" stroke="#468c75" stroke-width="3" marker-end="url(#arrow)"><path d="M172 692V717H320V742"/><path d="M468 692V717H320V742"/></g>
    <text x="320" y="779" text-anchor="middle" font-size="27" font-weight="600" fill="#2f4f3e">机器人可执行的数值动作</text>
    <text x="320" y="823" text-anchor="middle" font-size="21" fill="#6c7c73">关节 / 末端 / 夹爪：含义与维度需匹配机器人</text>
  </g>
</svg>
